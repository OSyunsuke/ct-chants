<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CT 中華隊 應援曲</title>
  <style>
    :root {
      --bg-color: #0b1a30;
      --card-bg: #142a4a;
      --card-hover: #1e3c66;
      --accent-color: #f5a623;
      --text-main: #ffffff;
      --text-sub: #9bb3d3;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      min-height: 100vh;
    }
    header {
      margin-bottom: 24px;
      text-align: left;
    }
    .badge {
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      color: var(--accent-color);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p.subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    /* 一覧ビュー */
    .search-box {
      margin: 20px 0;
    }
    .search-box input {
      width: 100%;
      max-width: 600px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #23436f;
      background: #10213b;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--accent-color);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 1000px;
    }
    .player-card {
      background-color: var(--card-bg);
      border: 1px solid #23436f;
      border-radius: 12px;
      padding: 24px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .player-card:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }
    .player-card .num {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .player-card .name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .player-card .ruby {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* 詳細ビュー */
    #detailView {
      display: none;
      max-width: 800px;
    }
    .back-btn {
      display: inline-block;
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #35588a;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }
    .player-info-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .player-badge {
      background: #1d3e6d;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
    }
    .player-meta h2 {
      font-size: 1.6rem;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .player-meta .ruby {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    /* YouTube リンクボタン */
    .yt-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #cc0000;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 10px 18px;
      border-radius: 8px;
      transition: background-color 0.2s;
    }
    .yt-btn:hover {
      background-color: #ff0000;
    }

    .tab-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #35588a;
      background: #142a4a;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #ffffff;
      color: #0b1a30;
      font-weight: 700;
      border-color: #ffffff;
    }

    .divider {
      height: 1px;
      background: #23436f;
      margin-bottom: 20px;
    }

    .lyrics-box {
      background: #10213b;
      border: 1px solid #23436f;
      border-radius: 10px;
      padding: 24px;
      white-space: pre-wrap;
      font-size: 1.05rem;
      line-height: 1.9;
      color: #f0f4f8;
      min-height: 120px;
    }
    .note {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 14px;
    }
  </style>
</head>

    let currentMode = 'both';
    let activePlayer = null;

    const grid = document.getElementById('playerGrid');

    function renderList(list) {
      grid.innerHTML = '';
      list.forEach(p => {
        const div = document.createElement('div');
        div.className = 'player-card';
        div.innerHTML = `
          <div class="num">${p.num}</div>
          <div class="name">${p.name}</div>
          <div class="ruby">${p.ruby}</div>
        `;
        div.onclick = () => selectPlayer(p);
        grid.appendChild(div);
      });
    }

    function selectPlayer(p) {
      activePlayer = p;
      document.getElementById('detailNum').innerText = p.num;
      document.getElementById('detailName').innerText = p.name;
      document.getElementById('detailRuby').innerText = p.ruby;

      const ytBtn = document.getElementById('ytLink');
      const searchUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(p.ytQuery);
      ytBtn.href = searchUrl;

      updateLyricsText();

      document.getElementById('listView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
    }

    function showListView() {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', 
          (mode === 'both' && idx === 0) || 
          (mode === 'kana' && idx === 1) || 
          (mode === 'zh' && idx === 2)
        );
      });
      updateLyricsText();
    }

    function updateLyricsText() {
      if (!activePlayer) return;
      document.getElementById('lyricsContent').innerText = activePlayer[currentMode];
    }

    function filterPlayers() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = playersData.filter(p => 
        p.num.toLowerCase().includes(q) || 
        p.name.toLowerCase().includes(q) || 
        p.ruby.toLowerCase().includes(q)
      );
      renderList(filtered);
    }

    renderList(playersData);
  </script>
