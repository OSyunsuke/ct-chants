<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CT 中華隊 應援曲</title>
  <style>
    :root {
      --bg-color: #0b1a30;
      --card-bg: #142a4a;
      --card-hover: #1e3c66;
      --accent-color: #f5a623;
      --text-main: #ffffff;
      --text-sub: #9bb3d3;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      min-height: 100vh;
    }
    header {
      margin-bottom: 16px;
      text-align: left;
    }
    .badge {
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      color: var(--accent-color);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p.subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .category-tabs {
      display: flex;
      gap: 10px;
      margin: 18px 0;
    }
    .cat-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #35588a;
      background: #10213b;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn.active {
      background: var(--accent-color);
      color: #0b1a30;
      border-color: var(--accent-color);
    }

    .search-box {
      margin-bottom: 20px;
    }
    .search-box input {
      width: 100%;
      max-width: 600px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #23436f;
      background: #10213b;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--accent-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 1000px;
    }
    .item-card {
      background-color: var(--card-bg);
      border: 1px solid #23436f;
      border-radius: 12px;
      padding: 24px 12px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 110px;
      transition: all 0.2s ease;
    }
    .item-card:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }
    .item-card .tag {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .item-card .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .item-card .sub {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    #detailView {
      display: none;
      max-width: 800px;
    }
    .back-btn {
      display: inline-block;
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #35588a;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }
    .detail-info-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .detail-badge {
      background: #1d3e6d;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }
    .detail-meta h2 {
      font-size: 1.6rem;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .detail-meta .sub {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .yt-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #cc0000;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 10px 18px;
      border-radius: 8px;
      transition: background-color 0.2s;
    }
    .yt-btn:hover {
      background-color: #ff0000;
    }

    .tab-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #35588a;
      background: #142a4a;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #ffffff;
      color: #0b1a30;
      font-weight: 700;
      border-color: #ffffff;
    }

    .divider {
      height: 1px;
      background: #23436f;
      margin-bottom: 20px;
    }

    .lyrics-box {
      background: #10213b;
      border: 1px solid #23436f;
      border-radius: 10px;
      padding: 24px;
      white-space: pre-wrap;
      font-size: 1.05rem;
      line-height: 1.9;
      color: #f0f4f8;
      min-height: 120px;
    }
    .note {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div id="listView">
    <header>
      <div class="badge">APBC • CHINESE TAIPEI</div>
      <h1>CT 中華隊 應援曲 ⚾</h1>
      <p class="subtitle">選手やチャンステーマを選んでコールをチェック！</p>
    </header>

    <div class="category-tabs">
      <button class="cat-btn active" id="tabPlayers" onclick="setCategory('players')">選手別應援曲</button>
      <button class="cat-btn" id="tabChants" onclick="setCategory('chants')">嗆司曲（チャンス）</button>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔎 検索（背番号・選手名・曲名）..." oninput="filterItems()">
    </div>

    <div class="grid" id="mainGrid"></div>
  </div>

  <div id="detailView">
    <button class="back-btn" onclick="showListView()">← 一覧に戻る</button>

    <div class="detail-header">
      <div class="detail-info-left">

        <div class="detail-meta">

          <div class="sub" id="detailSub">グオ・ティエンシン</div>
        </div>
      </div>
      <a id="ytLink" class="yt-btn" href="#" target="_blank" rel="noopener noreferrer">
        ▶ YouTubeで聴く
      </a>
    </div>

    <div class="tab-group" id="subTabs">
      <button class="tab-btn active" onclick="switchMode('both')">中国語＋カタカナ</button>
      <button class="tab-btn" onclick="switchMode('kana')">カタカナのみ</button>
      <button class="tab-btn" onclick="switchMode('zh')">中国語のみ</button>
    </div>

    <div class="divider"></div>

    <div class="lyrics-box" id="lyricsContent"></div>
    <div class="note">カタカナは練習用表記です。</div>
  </div>

    let currentCategory = 'players';
    let currentMode = 'both';
    let activeItem = null;

    const mainGrid = document.getElementById('mainGrid');

    function setCategory(cat) {
      currentCategory = cat;
      document.getElementById('tabPlayers').classList.toggle('active', cat === 'players');
      document.getElementById('tabChants').classList.toggle('active', cat === 'chants');
      document.getElementById('searchInput').value = '';
      filterItems();
    }

    function renderList(list) {
      mainGrid.innerHTML = '';
      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        const tagHtml = item.num ? `<div class="tag">${item.num}</div>` : '';
        div.innerHTML = `
          ${tagHtml}
          <div class="title">${item.name}</div>
          <div class="sub">${item.ruby}</div>
        `;
        div.onclick = () => selectItem(item);
        mainGrid.appendChild(div);
      });
    }

    function selectItem(item) {
      activeItem = item;
      const badgeEl = document.getElementById('detailBadge');
      if (item.num) {
        badgeEl.innerText = item.num;
        badgeEl.style.display = 'block';
      } else {
        badgeEl.style.display = 'none';
      }

      document.getElementById('detailTitle').innerText = item.name;
      document.getElementById('detailSub').innerText = item.ruby;

      const ytBtn = document.getElementById('ytLink');
      const searchUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(item.ytQuery);
      ytBtn.href = searchUrl;

      updateLyricsText();

      document.getElementById('listView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
    }

    function showListView() {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('#subTabs .tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', 
          (mode === 'both' && idx === 0) || 
          (mode === 'kana' && idx === 1) || 
          (mode === 'zh' && idx === 2)
        );
      });
      updateLyricsText();
    }

    function updateLyricsText() {
      if (!activeItem) return;
      document.getElementById('lyricsContent').innerText = activeItem[currentMode];
    }

    function filterItems() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const currentList = currentCategory === 'players' ? playersData : chantsData;
      const filtered = currentList.filter(item => {
        const numMatch = item.num ? item.num.toLowerCase().includes(q) : false;
        return numMatch || 
          item.name.toLowerCase().includes(q) || 
          item.ruby.toLowerCase().includes(q);
      });
      renderList(filtered);
    }

    renderList(playersData);
